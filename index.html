<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Offline Prof</title>
<meta name="description" content="논문 PDF를 휴대폰 안에서 번역하고 질문하는 오프라인 앱">
<meta name="theme-color" content="#FFF4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A1E22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Offline Prof">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top">
  <h1>My Offline Prof</h1>
  <span class="chip" id="netChip">확인 중</span>
</header>

<main id="main">
  <section class="view" id="view-library">
    <label class="upload">
      <strong>논문 PDF 올리기</strong>
      <span class="muted">영어 논문은 한국어로, 한국어 논문은 영어로 옮겨요</span>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf">
    </label>
    <p class="hint">PDF와 번역은 이 휴대폰에만 저장돼요. 처음 한 번 Wi-Fi에서 준비 탭의 모델을 받아 두면 지하철에서도 데이터 없이 써요.</p>
    <ul id="paperList"></ul>
  </section>
  <section class="view" id="view-read" hidden>
    <div class="readbar">
      <p class="title" id="readTitle"></p>
      <div class="row">
        <div class="seg" role="group" aria-label="보기 방식">
          <button type="button" data-show="ko" aria-pressed="true">번역</button>
          <button type="button" data-show="both" aria-pressed="false">같이</button>
          <button type="button" data-show="src" aria-pressed="false">원문</button>
        </div>
        <button class="btn small" id="transBtn">번역 시작</button>
        <button class="btn ghost small" id="exportBtn">번역본 내보내기</button>
      </div>
      <div class="bar spaced"><div id="readBar"></div></div>
      <div id="readStatus"></div>
    </div>
    <div id="paras"></div>
  </section>
  <section class="view" id="view-ask" hidden>
    <p id="askPaper" class="muted"></p>
    <div class="chips" id="chips"></div>
    <div id="pin"><button type="button" id="unpin" aria-label="단락 고정 해제">✕</button><span id="pinText"></span></div>
    <div id="msgs"></div>
    <form class="composer" id="askForm">
      <textarea id="askInput" rows="1" placeholder="이 논문에 대해 물어보세요"></textarea>
      <button class="btn" id="askBtn" type="submit">묻기</button>
    </form>
  </section>
  <section class="view" id="view-setup" hidden>
    <div class="card">
      <h2>오프라인 준비</h2>
      <ul class="checks" id="checks"></ul>
      <p class="hint" id="storageText"></p>
    </div>
    <div class="card">
      <h2>AI 모델</h2>
      <div id="sizeOpts"></div>
      <div class="rowline">
        <label for="engineSel">실행 방식</label>
        <select id="engineSel" class="select">
          <option value="auto">자동</option>
          <option value="gpu">GPU (빠름)</option>
          <option value="cpu">CPU (어느 폰이든)</option>
        </select>
      </div>
      <div class="actions">
        <button class="btn" id="dlBtn" type="button">모델 받기</button>
        <button class="btn ghost" id="rmBtn" type="button">받은 모델 지우기</button>
      </div>
      <div class="bar spaced"><div id="dlBar"></div></div>
      <div id="modelStatus"></div>
    </div>
    <div class="card">
      <h2>읽기 설정</h2>
      <div class="rowline"><label for="fsRange">글자 크기</label><input type="range" id="fsRange" min="14" max="24" step="1"></div>
      <div class="rowline"><label for="wakeChk">번역하는 동안 화면 켜 두기</label><input type="checkbox" id="wakeChk"></div>
      <p class="hint">휴대폰 화면이 꺼지거나 다른 앱으로 가면 번역이 잠시 멈추고, 돌아오면 이어서 해요.</p>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="메뉴">
  <button type="button" data-tab="library" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10 5h4v14h-4zM15.5 5.5l3.8-.9 2.7 13.6-3.8.8z"/></svg>서재</button>
  <button type="button" data-tab="read"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5c-3.5-.5-6.5 0-8.5 1.5zM12 6.5v13"/></svg>읽기</button>
  <button type="button" data-tab="ask"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.7-.9 1.3M12 14.2v.1"/></svg>질문</button>
  <button type="button" data-tab="setup"><svg viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5M5 17v3h14v-3"/></svg>준비</button>
</nav>

<div class="toast" id="toast" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
